name: CI

on:
  push:
    branches: [master, develop, version-14, version-15, version-16]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Frappe ${{ matrix.frappe }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { frappe: version-14, python: "3.10", node: 18 }
          - { frappe: version-15, python: "3.11", node: 18 }
          - { frappe: version-16, python: "3.14", node: 24 }

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install bench
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
          pip install frappe-bench

      - name: Create bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" \
            --frappe-branch ${{ matrix.frappe }} ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:13000

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets --branch ${{ matrix.frappe }} erpnext
          bench get-app --skip-assets whatsapp_connect $GITHUB_WORKSPACE

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test.localhost --db-root-username root --db-root-password root \
            --admin-password admin --install-app erpnext --install-app whatsapp_connect
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost execute erpnext.setup.utils.before_tests

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test.localhost run-tests --app whatsapp_connect
