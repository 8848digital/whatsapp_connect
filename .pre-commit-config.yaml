exclude: |
  (?x)(
      node_modules|.git|
      ^\.claude/|
      ^whatsapp_connect/commands/(__init__|export_fixtures)\.py$|
      ^whatsapp_connect/utils/api_handlers/(envelope|error_messages|response_formatter)\.py$
  )
default_stages: [commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-yaml
      - id: no-commit-to-branch
        args: ['--branch', 'master', '--branch', 'develop']
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/frappe/black
    rev: 951ccf4d5bb0d692b457a5ebc4215d755618eb68
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                whatsapp_connect/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                whatsapp_connect/www/website_script.js|
                whatsapp_connect/templates/includes/.*|
                whatsapp_connect/public/js/lib/.*|
                whatsapp_connect/website/doctype/website_theme/website_theme_template.scss
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                whatsapp_connect/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                whatsapp_connect/www/website_script.js|
                whatsapp_connect/templates/includes/.*|
                whatsapp_connect/public/js/lib/.*
            )$

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        additional_dependencies: ['flake8-bugbear',]

  - repo: local
    hooks:
    - id: check-max-lines
      name: Check Max Lines
      entry: python scripts/check_max_lines.py
      language: python
      types: [python]
